name: Digestive module browser smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Run module browser tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ipa-http.log 2>&1 &
          npx playwright test tests/digestive-smoke.spec.cjs --reporter=line --workers=1

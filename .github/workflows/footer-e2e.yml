name: Footer E2E QA
on:
  push:
    branches:
      - qa/context-footer-e2e
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ipa-http.log 2>&1 &
          echo $! > /tmp/ipa-http.pid
          sleep 2
      - name: Run footer E2E
        run: node qa/footer-e2e.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footer-e2e-evidence
          path: qa-artifacts/
          if-no-files-found: warn
